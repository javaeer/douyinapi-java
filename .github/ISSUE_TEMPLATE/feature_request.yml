name: ✨ 功能建议
description: 提出一个新的功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚使用场景，帮助我们评估优先级。

  - type: textarea
    id: problem
    attributes:
      label: 你希望解决的问题
      description: 当前遇到的痛点或不便
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你期望 SDK 提供怎样的 API 或行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法
    validations:
      required: false

  - type: input
    id: doc-link
    attributes:
      label: 相关官方文档链接
      description: 若涉及某个开放平台接口，请附上文档地址
    validations:
      required: false

name: 🐞 Bug 报告
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量填写完整，以便我们更快定位。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我已阅读 README 与相关文档
          required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK 版本
      description: 例如 1.0.0-alpha
      placeholder: 1.0.0-alpha
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: JDK 版本
      placeholder: 例如 OpenJDK 17.0.10
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - oauth（授权 / 账号）
        - pay（担保支付）
        - util（签名 / 工具）
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 你期望发生什么？实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / 最小复现代码
      render: java
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或异常堆栈
      description: 请注意去除 client_secret、salt 等敏感信息
      render: shell
    validations:
      required: false
